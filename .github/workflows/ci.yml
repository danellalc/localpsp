name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t localpsp:ci .
      - name: smoke test the image
        run: |
          docker run -d --name localpsp-ci -p 8420:8420 localpsp:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8420/_localpsp/state > /dev/null && break
            sleep 0.5
          done
          curl -sf -X POST http://localhost:8420/asaas/v3/customers \
            -H "Content-Type: application/json" \
            -d '{"name":"CI","cpfCnpj":"12345678901"}' | grep -q '"object":"customer"'
          docker logs localpsp-ci
          docker stop localpsp-ci
